name: Build XBPS
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build in official Void container
        run: |
          mkdir -p artifacts
          docker run --rm --privileged -v /dev:/dev -v "$PWD:/overlay:ro" -v "$PWD/artifacts:/out" ghcr.io/void-linux/void-glibc-full /bin/sh /overlay/ci/build.sh
      - name: Test XBPS signing with disposable key
        run: |
          docker build -t hyperv-signing -f ci/signing.Dockerfile .
          docker run --rm --network none -v "$PWD:/overlay:ro" -v "$PWD/artifacts:/input:ro" hyperv-signing /bin/sh /overlay/ci/test-signing.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hyperv-daemons-x86_64
          path: artifacts/
          if-no-files-found: error
